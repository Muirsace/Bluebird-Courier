appId: com.octo.monitor
productName: OCTO 仓库监控器
directories:
  output: release
# better-sqlite3 自带 win32-x64 预编译产物（N-API），无需 node-gyp 源码重建；
# 开着会让没有 MSVC/Python 的机器直接打包失败。
npmRebuild: false
files:
  - dist/**
  - package.json
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
