<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1280 1280" role="img" aria-labelledby="title desc">
  <title id="title">青鸟信使浅色界面标志</title>
  <desc id="desc">青鸟信使浅色界面使用的透明蓝色折纸飞鸟标志。</desc>
  <defs>
    <linearGradient id="body" x1="880" y1="480" x2="470" y2="1040" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B55D9"/>
      <stop offset=".55" stop-color="#084FC8"/>
      <stop offset="1" stop-color="#073FAF"/>
    </linearGradient>
    <linearGradient id="wing" x1="225" y1="225" x2="780" y2="661" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1879D3"/>
      <stop offset="1" stop-color="#146ABF"/>
    </linearGradient>
    <linearGradient id="fold" x1="260" y1="440" x2="715" y2="751" gradientUnits="userSpaceOnUse">
      <stop stop-color="#104ACB"/>
      <stop offset="1" stop-color="#0B40B3"/>
    </linearGradient>
    <linearGradient id="beak" x1="1049" y1="532" x2="1133" y2="598" gradientUnits="userSpaceOnUse">
      <stop stop-color="#087A97"/>
      <stop offset="1" stop-color="#0C657C"/>
    </linearGradient>
  </defs>
  <!-- Beak sits behind the head, keeping the silhouette continuous. -->
  <path fill="url(#beak)" d="M1042 527 L1128 575 Q1141 583 1125 593 L1056 624 Z"/>
